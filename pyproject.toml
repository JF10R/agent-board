[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-board"
version = "1.0.0"
description = "Git-local, file-backed coordination board for agent teams (messages, acks, roadmap, web dashboard)."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
agent-board = "agent_board.cli:main"
agent-board-web = "agent_board.web:main"
agent-board-watch = "agent_board.watch:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_board = ["web_static/*"]
