name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check --select F src/agent_board agent_board.py agent_board_web.py agent_board_watch.py
      - run: python -m pytest tests -q
      - run: python -m build
      - run: python -m venv /tmp/agent-board-wheel
      - run: /tmp/agent-board-wheel/bin/python -m pip install dist/*.whl
      - working-directory: /tmp
        run: /tmp/agent-board-wheel/bin/python -c "from importlib.resources import files; import agent_board.cli, agent_board.web, agent_board.watch; assert files('agent_board').joinpath('web_static/index.html').is_file()"
